name: Stage artifacts for release
description: "Download versioned Maven artifacts from JFrog and prepare release sidecars"

inputs:
  jfrog-platform-url:
    description: "JFrog platform URL"
    required: false
    default: https://aerospike.jfrog.io
  oidc-provider:
    description: "OIDC provider name"
    required: true
  oidc-audience:
    description: "OIDC audience"
    required: true
  staging-folder:
    description: "Staging folders. Input should be a JSON array of staging folders"
    required: false
    default: '["staging","github"]'
  target-repository:
    description: "Target repository in JFrog"
    required: false
    default: database-maven-local
  artifact-version:
    description: "Artifact version"
    required: true
  group-id:
    description: "Maven groupId"
    required: false
    default: com.aerospike
  artifact-id:
    description: "Maven artifactId"
    required: false
    default: aerospike-jdbc

runs:
  using: "composite"
  steps:
    - name: Debug staging inputs
      shell: bash
      run: |
        echo "${{ inputs.jfrog-platform-url }}"
        echo "${{ inputs.staging-folder }}"
        echo "${{ inputs.target-repository }}"
        echo "${{ inputs.artifact-version }}"
        echo "${{ inputs.group-id }}"
        echo "${{ inputs.artifact-id }}"

    - name: Setup JFrog CLI
      uses: step-security/setup-jfrog-cli@f67dd6dcfe5fab8d1ebd695c456631275009a39d # v5.2.0
      env:
        JF_URL: ${{ inputs.jfrog-platform-url }}
        JF_PROJECT: database
      with:
        oidc-provider-name: ${{ inputs.oidc-provider }}
        oidc-audience: ${{ inputs.oidc-audience }}

    - name: Create staging folders
      shell: bash
      run: |
        echo '${{ inputs.staging-folder }}' | jq -r '.[]' | while read -r FOLDER; do
          mkdir -p "$FOLDER"
        done

    - name: Download artifacts from JFrog
      shell: bash
      working-directory: ${{ fromJson(inputs.staging-folder)[0] }}
      run: |
        set -euo pipefail

        GROUP_PATH=$(echo "${{ inputs.group-id }}" | tr '.' '/')
        ARTIFACT_PATH="${GROUP_PATH}/${{ inputs.artifact-id }}/${{ inputs.artifact-version }}"
        REPO_KEY="${{ inputs.target-repository }}"

        echo "Downloading artifacts from ${REPO_KEY}/${ARTIFACT_PATH}/"
        jf rt dl --project database --flat=true "${REPO_KEY}/${ARTIFACT_PATH}/*" .

        find . -type f -name "maven-metadata*" -delete

        if ! find . -type f | grep -q .; then
          echo "ERROR: no artifacts downloaded from ${REPO_KEY}/${ARTIFACT_PATH}/" >&2
          exit 1
        fi

    - name: Generate checksum sidecars
      shell: bash
      working-directory: ${{ fromJson(inputs.staging-folder)[0] }}
      run: |
        set -euo pipefail

        checksum_one() {
          local file=$1
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 1 "$file" | awk '{print $1}' > "${file}.sha1"
            shasum -a 256 "$file" | awk '{print $1}' > "${file}.sha256"
          else
            sha1sum "$file" | awk '{print $1}' > "${file}.sha1"
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          fi

          if command -v md5sum >/dev/null 2>&1; then
            md5sum "$file" | awk '{print $1}' > "${file}.md5"
          elif command -v md5 >/dev/null 2>&1; then
            md5 -q "$file" > "${file}.md5"
          else
            echo "WARNING: md5sum/md5 not available; skipping MD5 for ${file}" >&2
          fi
        }

        find . -type f \
          ! -name "*.md5" \
          ! -name "*.sha1" \
          ! -name "*.sha256" \
          ! -name "maven-metadata*" \
          -print0 | while IFS= read -r -d '' FILE; do
            echo "Creating checksums for: ${FILE}"
            checksum_one "$FILE"
          done

    - name: Debug staged content
      shell: bash
      working-directory: ${{ fromJson(inputs.staging-folder)[0] }}
      run: |
        pwd
        ls -laR
