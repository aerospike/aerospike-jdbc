# Read-only JFrog artifact download + uber-jar build at source commit + draft GitHub release.
# Does not promote or write to JFrog. Maven Central / Sonatype are separate (JF UI).
name: Draft GitHub release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Version to be released to GitHub"
        required: true
      artifact-download-repository:
        type: string
        description: "JFrog repo for read-only jf rt dl. Default database-maven-local (release deploy repo)."
        required: false
        default: "database-maven-local"

jobs:
  draft-release:
    name: Draft GitHub release
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release version and source commit
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          DOWNLOAD_REPO="${{ inputs.artifact-download-repository }}"

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: version is required." >&2
            exit 1
          fi

          if [[ "$VERSION" == *"-SNAPSHOT"* ]]; then
            echo "ERROR: SNAPSHOT builds are not published to GitHub (${VERSION})." >&2
            exit 1
          fi

          TAG_REF=""
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            TAG_REF="${VERSION}"
          elif git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            TAG_REF="v${VERSION}"
          else
            echo "ERROR: Could not find a release tag for ${VERSION} or v${VERSION}." >&2
            exit 1
          fi

          COMMIT=$(git rev-parse "${TAG_REF}^{commit}")

          echo "artifact-version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source-commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "source-tag=${TAG_REF}" >> "$GITHUB_OUTPUT"
          echo "download-repository=${DOWNLOAD_REPO}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=${TAG_REF} commit=${COMMIT} repo=${DOWNLOAD_REPO}"

      - uses: ./.github/actions/stage-release-artifacts
        with:
          oidc-provider: ${{ secrets.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ secrets.JFROG_OIDC_AUDIENCE }}
          target-repository: ${{ steps.resolve.outputs.download-repository }}
          artifact-version: ${{ steps.resolve.outputs.artifact-version }}
          staging-folder: '["staging","github"]'

      - uses: ./.github/actions/build-sign-uber-jar
        with:
          source-commit: ${{ steps.resolve.outputs.source-commit }}
          artifact-version: ${{ steps.resolve.outputs.artifact-version }}
          staging-folder: staging
          gpg-secret-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-pass: ${{ secrets.GPG_PASS }}

      - name: Generate release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail

          COMMIT="${{ steps.resolve.outputs.source-commit }}"
          TAG="${{ steps.resolve.outputs.source-tag }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${COMMIT}^" 2>/dev/null || true)

          if [[ -n "$PREVIOUS_TAG" ]]; then
            NOTES=$(git log "${PREVIOUS_TAG}..${COMMIT}" --pretty=format:"- %s" 2>/dev/null || true)
          else
            NOTES=$(git log -n 50 "${COMMIT}" --pretty=format:"- %s" 2>/dev/null || true)
          fi

          echo "release-notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "Changes for ${TAG}" >> "$GITHUB_OUTPUT"
          echo "${NOTES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publish-to-github
        with:
          release-notes: ${{ steps.release-notes.outputs.release-notes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-version: ${{ steps.resolve.outputs.artifact-version }}
