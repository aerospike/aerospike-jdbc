name: Build project

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, stage ]

jobs:
  build:
    name: Build (Aerospike ${{ matrix.server-tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server-tag:
          - 8.1.2.5
          - 8.2.0.0

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Checkout repo using https://github.com/marketplace/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: 8

      - name: Set up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.8

      # See: https://github.com/actions/cache/blob/main/examples.md#java---maven
      - name: Maven cache and restore deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Aerospike Database
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
        with:
          oidc-provider: ${{ secrets.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ secrets.JFROG_OIDC_AUDIENCE }}
          server-tag: ${{ matrix.server-tag }}

      - name: Build with Maven
        run: mvn clean package -B -U
